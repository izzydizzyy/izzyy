<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
      color: #fff;

      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      font-size: clamp(40px, 8vw, 90px);
      font-weight: 600;
      letter-spacing: -4px;
      margin: 0;

      animation: appear 0.6s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <h1>LOL, wsp buddy</h1>
</body>
</html>
