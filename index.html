<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>izzy</title>
  <meta name="description" content="izzy — developer, projects, and links.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #f2f2f2;
      background: #050505;
      font-family: Inter, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      overflow: hidden;
      background: #050505;
    }

   .background video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(75%) contrast(105%);
}

    .shade {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    linear-gradient(
      to bottom,
      rgba(0, 0, 0, .15),
      rgba(0, 0, 0, .25) 65%,
      rgba(5, 5, 5, .80) 100%
    );
}

    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .045;
      pointer-events: none;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 48px 24px;
    }

    .hero-inner {
      width: min(920px, 100%);
      margin: auto;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .avatar {
      width: 82px;
      height: 82px;
      border-radius: 22px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .35);
    }

    .name {
      margin: 0 0 6px;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1;
      letter-spacing: -2px;
      font-weight: 600;
    }

    .sub {
      margin: 0;
      color: #b9b9b9;
      font-size: 15px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .link {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(12, 12, 12, .58);
      backdrop-filter: blur(10px);
      color: #e7e7e7;
      font-size: 13px;
      font-weight: 500;
      transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease;
    }

    .link:hover {
      transform: translateY(-1px);
      background: rgba(26, 26, 26, .72);
      border-color: rgba(255, 255, 255, .25);
    }

    .scroll {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      color: #a5a5a5;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .scroll i {
      font-size: 13px;
    }

    .skills-section {
      min-height: 72vh;
      display: flex;
      align-items: center;
      padding: 70px 24px 110px;
      background:
        linear-gradient(
          to bottom,
          rgba(5, 5, 5, .12),
          rgba(5, 5, 5, .76) 16%,
          #050505 100%
        );
    }

    .skills {
      width: min(980px, 100%);
      margin: auto;
      padding: 28px;
      border: 1px solid #202020;
      border-radius: 18px;
      background: rgba(10, 10, 10, .72);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .30);
      backdrop-filter: blur(14px);
    }

    .skills h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: -.5px;
    }

    .skills p {
      margin: 0 0 22px;
      color: #989898;
      font-size: 14px;
      line-height: 1.6;
    }

    .stack {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .tech {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border: 1px solid #292929;
      border-radius: 9px;
      background: #111;
      color: #d7d7d7;
      font-size: 13px;
      font-weight: 500;
    }

    .tech i {
      width: 15px;
      text-align: center;
      color: #f0f0f0;
    }

    .footer {
      padding: 26px 24px 34px;
      background: #050505;
      color: #666;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .hero {
        padding-inline: 20px;
      }

      .profile {
        align-items: flex-start;
      }

      .avatar {
        width: 68px;
        height: 68px;
        border-radius: 18px;
      }

      .name {
        font-size: 36px;
        letter-spacing: -1.5px;
      }

      .links {
        display: grid;
        grid-template-columns: 1fr;
      }

      .link {
        width: 100%;
      }

      .skills-section {
        padding-inline: 18px;
      }

      .skills {
        padding: 22px 18px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="background">
    <video autoplay muted loop playsinline>
      <source src="background.webm" type="video/webm">
    </video>
  </div>

  <div class="shade"></div>
  <div class="grain"></div>

  <main>
    <section class="hero" id="top">
      <div class="hero-inner">
        <div class="profile">
          <img
            class="avatar"
            src="https://cdn.discordapp.com/avatars/1313630076809510975/56fcd1ee64d351250257bc14dce99791.webp?size=1024"
            alt="izzy profile picture"
          >

          <div>
            <h1 class="name">izzy</h1>
            <p class="sub">developer / discord / web</p>
          </div>
        </div>

        <div class="links">
          <a
            class="link"
            href="https://discord.com/users/1313630076809510975"
            target="_blank"
            rel="noreferrer"
          >
            <i class="fa-brands fa-discord"></i>
            Discord
          </a>

          <a
            class="link"
            href="https://github.com/izzydizzyy"
            target="_blank"
            rel="noreferrer"
          >
            <i class="fa-brands fa-github"></i>
            GitHub
          </a>

          <a
            class="link"
            href="https://www.meta.com/profiles/izzyiswizzy/"
            target="_blank"
            rel="noreferrer"
          >
            <i class="fa-solid fa-vr-cardboard"></i>
            Meta Quest / izzyiswizzy
          </a>
        </div>
      </div>

      <a class="scroll" href="#skills">
        scroll down
        <i class="fa-solid fa-chevron-down"></i>
      </a>
    </section>

    <section class="skills-section" id="skills">
      <div class="skills">
        <h2>Skills & Stack</h2>
        <p>
          tools and languages i use for websites, bots, systems, and random projects.
        </p>

        <div class="stack">
          <span class="tech"><i class="fa-brands fa-python"></i>Python</span>
          <span class="tech"><i class="fa-brands fa-js"></i>JavaScript</span>
          <span class="tech"><i class="fa-brands fa-node-js"></i>Node.js</span>
          <span class="tech"><i class="fa-brands fa-html5"></i>HTML</span>
          <span class="tech"><i class="fa-brands fa-css3-alt"></i>CSS</span>
          <span class="tech"><i class="fa-brands fa-discord"></i>Discord</span>
          <span class="tech"><i class="fa-solid fa-database"></i>SQLite</span>
          <span class="tech"><i class="fa-solid fa-code"></i>APIs</span>
          <span class="tech"><i class="fa-brands fa-git-alt"></i>Git</span>
          <span class="tech"><i class="fa-brands fa-github"></i>GitHub</span>
          <span class="tech"><i class="fa-brands fa-cloudflare"></i>Cloudflare</span>
          <span class="tech"><i class="fa-solid fa-terminal"></i>Bash</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    izzy / 2026
  </footer>
</body>
</html>
